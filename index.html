<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>nana · 启动与旧版迁移</title>
<style>body{font:16px/1.8 system-ui;background:#f7f6f4;color:#222;max-width:660px;margin:12vh auto;padding:24px}a,button{display:inline-block;padding:10px 20px;border-radius:20px;border:1px solid #c8622e;color:#c8622e;background:white;text-decoration:none;font:inherit;cursor:pointer}p{color:#666}code{background:#eee;padding:3px 8px}</style>
<h1>nana 已升级</h1><p>在项目目录执行 <code>npm ci</code>，再执行 <code>npm start</code>，即可开始阅读。</p>
<a href="http://localhost:8761">打开新版 nana</a>
<h2>保留旧版书库</h2><p>如果你在当前访问地址使用过旧版，先导出备份，再到新版「设置 → 恢复备份」。书籍、音乐、阅读进度会一同迁移，API Key 需重新填写。旧数据不会被删除。</p>
<button id="backup">导出当前地址的旧版数据</button><p id="status"></p>
<script src="public/backup.js"></script><script>
document.getElementById('backup').onclick=async()=>{try{const n=await MoyinBackup.export();document.getElementById('status').textContent='已导出 '+n+' 本书，请在新版设置中恢复。';}catch(e){document.getElementById('status').textContent=e.message;}};
</script></html>
